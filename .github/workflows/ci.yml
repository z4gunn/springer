name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the schema validator dependencies
        run: python -m pip install --quiet jsonschema referencing

      - name: Validate the repo against the CLAUDE.md hard rules
        run: python scripts/validate-repo.py

      - name: Schema registry self-check
        run: python schemas/validate.py --self-check

      - name: Harness script and hook tests
        run: python -m unittest discover -s tests -t tests -v
